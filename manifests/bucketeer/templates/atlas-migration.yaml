{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-migrate"
  labels:
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade

spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  {{- with .Values.migration.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    spec:
      {{- with .Values.migration.imagePullSecrets | default .Values.global.image.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: atlas-migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          args:
            - migrate
            - apply
            {{- with .Values.migration.revisionsSchema }}
            - --revisions-schema
            - {{ . | quote }}
            {{- end }}
            - --baseline
            - "{{ .Values.migration.dbBaseline }}"
            - -u
            {{- if .Values.migration.existingSecret }}
            {{- /* Kubernetes expands $(VAR) from the container environment, so the URL never appears in the Job spec. */}}
            - "$(MIGRATION_DB_URL)"
            {{- else }}
            - {{ .Values.migration.dbUrl }}
            {{- end }}
          {{- if .Values.migration.existingSecret }}
          env:
            - name: MIGRATION_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.existingSecret | quote }}
                  key: {{ .Values.migration.existingSecretKey | default "db-url" | quote }}
          {{- end }}
          {{- if .Values.global.operationalDatabase.postgres.sslSecretName }}
          volumeMounts:
            - name: postgres-cert-secret
              mountPath: /usr/local/certs/postgres
              readOnly: true
          {{- end }}
      {{- if .Values.global.operationalDatabase.postgres.sslSecretName }}
      volumes:
        - name: postgres-cert-secret
          secret:
            secretName: {{ .Values.global.operationalDatabase.postgres.sslSecretName }}
      {{- end }}
{{- end }}
