{{- $mysqlExisting := include "web.db-password-existing-secret" (dict "root" . "engine" "mysql") }}
{{- $postgresExisting := include "web.db-password-existing-secret" (dict "root" . "engine" "postgres") }}
{{- $mysqlPass := .Values.env.operationalDatabase.mysql.pass | default .Values.global.operationalDatabase.mysql.pass }}
{{- $postgresPass := .Values.env.operationalDatabase.postgres.pass | default .Values.global.operationalDatabase.postgres.pass }}
{{- /*
A password stays in this Secret for as long as `pass` is set, also when an
existing Secret is in use. Pods created before the switch to the existing Secret
still read it, and they must be able to start until the switch has rolled out.
*/}}
{{- $keepMysql := or (not $mysqlExisting) $mysqlPass }}
{{- $keepPostgres := or (not $postgresExisting) $postgresPass }}
{{- if or $keepMysql $keepPostgres }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "web.db-credentials-secret" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ template "web.name" . }}
    chart: {{ template "web.chart" . }}
    release: {{ template "web.fullname" . }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  {{- if $keepMysql }}
  mysql-pass: {{ $mysqlPass | default "" | toString | b64enc | quote }}
  {{- end }}
  {{- if $keepPostgres }}
  postgres-pass: {{ $postgresPass | default "" | toString | b64enc | quote }}
  {{- end }}
{{- end }}
