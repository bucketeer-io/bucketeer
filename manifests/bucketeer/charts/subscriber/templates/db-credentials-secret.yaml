{{- if eq (include "subscriber.deploy" .) "true" }}
{{- $mysqlExisting := include "subscriber.db-password-existing-secret" (dict "root" . "engine" "mysql") }}
{{- $postgresExisting := include "subscriber.db-password-existing-secret" (dict "root" . "engine" "postgres") }}
{{- if or (not $mysqlExisting) (not $postgresExisting) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "subscriber.db-credentials-secret" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ template "subscriber.name" . }}
    chart: {{ template "subscriber.chart" . }}
    release: {{ template "subscriber.fullname" . }}
    heritage: {{ .Release.Service }}
type: Opaque
data:
  {{- if not $mysqlExisting }}
  mysql-pass: {{ .Values.env.operationalDatabase.mysql.pass | default .Values.global.operationalDatabase.mysql.pass | default "" | toString | b64enc | quote }}
  {{- end }}
  {{- if not $postgresExisting }}
  postgres-pass: {{ .Values.env.operationalDatabase.postgres.pass | default .Values.global.operationalDatabase.postgres.pass | default "" | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
