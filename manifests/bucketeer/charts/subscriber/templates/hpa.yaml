{{- if and (eq (include "subscriber.deploy" .) "true") .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ template "subscriber.fullname" . }}
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    {{- if (.Values.global.rollouts | default dict).enabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ template "subscriber.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: {{ .Values.hpa.metrics.cpu.targetAverageUtilization }}
          type: Utilization
{{- end }}
