name: Build and Push delete-e2e-data-postgres Multi-Arch Image

on:
  push:
    branches:
      - main
    paths:
      - 'hack/delete-e2e-data-postgres/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (leave empty to use the Makefile TAG)"
        type: string
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bucketeer-io/bucketeer-delete-e2e-data-postgres

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Get image tag
        id: tag
        run: |
          # Use input tag if provided, otherwise extract from the Makefile
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG=$(grep -E '^TAG=' hack/delete-e2e-data-postgres/Makefile | sed 's/TAG=//')
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using tag: ${TAG}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hack/delete-e2e-data-postgres/go.mod

      # The Docker build context is hack/delete-e2e-data-postgres only, but its
      # go.mod replaces bucketeer/v2 with ../../, so the parent module must be
      # vendored into the context before building the image. `make deps` runs
      # `go mod tidy` before vendoring, so drift in the parent module's
      # dependencies since the last committed go.mod/go.sum doesn't fail the
      # build (bare `go mod vendor` errors with "updates to go.mod needed").
      - name: Vendor dependencies
        working-directory: hack/delete-e2e-data-postgres
        run: make deps

      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/arm64

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          use: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./hack/delete-e2e-data-postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=delete-e2e-data-postgres
          cache-to: type=gha,mode=max,scope=delete-e2e-data-postgres
          provenance: false
