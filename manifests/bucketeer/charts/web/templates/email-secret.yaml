{{- $email := .Values.global.email | default dict }}
{{- if not $email.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "web.fullname" . }}-email-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ template "web.name" . }}
    chart: {{ template "web.chart" . }}
    release: {{ template "web.fullname" . }}
    heritage: {{ .Release.Service }}
type: Opaque
stringData:
  email-config.json: |-
    {{ toJson (omit $email "existingSecret") }}
{{- end }}
