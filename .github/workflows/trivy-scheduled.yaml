name: trivy-scheduled-scan

on:
  schedule:
    - cron: "0 1 * * 1" # Monday 10:00 at JST
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io/bucketeer-io

jobs:
  scan-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - bucketeer-api
          - bucketeer-web
          - bucketeer-batch
          - bucketeer-subscriber
          - bucketeer-migration
          - bucketeer-migration-postgres
    steps:
      - name: Scan ${{ matrix.image }} for vulnerabilities
        id: scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image # scan the actual Docker image, not just source files
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ matrix.image }}:latest
          scanners: vuln # check for known CVEs only (not misconfig or secrets)
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
        continue-on-error: true

      # TODO: auto-create fix PR when vulnerabilities are detected (no official Action exists)
      - name: Notify Slack on new vulnerabilities
        if: steps.scan.outcome == 'failure'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
            "text": "",
            "blocks": [],
            "attachments": [
              {
                "title": "[bucketeer] Trivy: CRITICAL/HIGH vulnerabilities in ${{ matrix.image }}",
                "title_link": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": "danger"
              }
            ]
