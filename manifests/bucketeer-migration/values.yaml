fullnameOverride: "bucketeer-migration"

# Enable the migration job (suppressed when rollback.enabled is true)
enabled: true

annotations: {}

image:
  # PostgreSQL: ghcr.io/bucketeer-io/bucketeer-migration-postgres
  repository: ghcr.io/bucketeer-io/bucketeer-migration
  pullPolicy: IfNotPresent
  tag: v0.4.5 # x-release-please-version
  imagePullSecrets: []

backoffLimit: 0
ttlSecondsAfterFinished:

# URL to access the DB to do the migration
# E.g. mysql://user:password@host:port/db_name
# The URL is passed to the migration job as a plain argument, so anyone who
# can read the Job or the Helm release can read the password. Prefer
# `existingSecret` below.
dbUrl:
# Existing Secret to read the URL from instead of `dbUrl`. When set, `dbUrl`
# is ignored. The Secret must already exist in the release namespace.
# Percent-encode special characters in the user name and password.
existingSecret: ""
existingSecretKey: "db-url"

# The migration baseline
# First revision
dbBaseline: "20240626022133"

# Database migration rollback configuration
# WARNING: Rollback can cause data loss. Only use when necessary.
rollback:
  # Enable the rollback job (set to true to create the Job resource)
  enabled: false

  # Dry-run mode: If true, only previews changes without executing
  # Set to false to actually execute the rollback
  dryRun: true

  # Required when rollback is enabled: reachable, empty, disposable database.
  # Atlas uses and cleans this database; never point it at the target database.
  # Use the same database engine and version as the target.
  # E.g. mysql://user:password@dev-mysql:3306/bucketeer_dev
  devUrl: ""

  # Rollback configuration
  # Option 1: Rollback last N migrations
  count: 1

  # Option 2: Rollback to specific version (overrides count)
  # Example: "20240815043128"
  version: ""

resources: {}
