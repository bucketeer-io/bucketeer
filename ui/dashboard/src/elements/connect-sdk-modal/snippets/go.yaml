id: go
label: Go
kind: server
installLanguage: bash
codeLanguage: go
install: go get github.com/bucketeer-io/go-server-sdk
code: |-
  import (
    "context"
    "log"
    "time"

    "github.com/bucketeer-io/go-server-sdk/pkg/bucketeer"
    "github.com/bucketeer-io/go-server-sdk/pkg/bucketeer/user"
  )

  ctx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
  defer cancel()

  client, err := bucketeer.NewSDK(
    ctx,
    bucketeer.WithAPIKey("{{apiKey}}"),
    bucketeer.WithAPIEndpoint("{{apiEndpoint}}"),
    bucketeer.WithTag("{{featureTag}}"),
  )
  if err != nil {
    log.Fatalf("Failed to initialize the client: %v", err)
  }

  endUser := user.NewUser("END_USER_ID", nil)
  showNewFeature := client.BoolVariation(ctx, endUser, "{{flagId}}", false)
  if showNewFeature {
    // Show the new feature
  } else {
    // Run the default code
  }
